<title>Sổ Thu Chi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: một cột như cuốn sổ bỏ túi — tổng tháng trên cùng, ô ghi nhanh, biểu đồ, rồi các trang theo ngày */
:root{
  --bg:#EEF3F1; --paper:#FFFFFF; --ink:#13201D; --muted:#5E6E69; --line:#D6E0DC;
  --accent:#0B6E60; --accent-soft:#DCEEEA;
  --thu:#18804A; --thu-soft:#DDF1E5; --chi:#B8452A; --chi-soft:#F8E3DC;
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --paper:#16201D; --ink:#E6EEEB; --muted:#93A39E; --line:#26332F;
  --accent:#4FC2AE; --accent-soft:#183732;
  --thu:#5BCB8B; --thu-soft:#173323; --chi:#F08A6C; --chi-soft:#3A2019; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --paper:#16201D; --ink:#E6EEEB; --muted:#93A39E; --line:#26332F;
  --accent:#4FC2AE; --accent-soft:#183732;
  --thu:#5BCB8B; --thu-soft:#173323; --chi:#F08A6C; --chi-soft:#3A2019; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:4px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;line-height:1}
.month span{min-width:104px;text-align:center;font-weight:600}

.sum{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.sum .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.left{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.left.neg{color:var(--chi)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{border-radius:12px;padding:10px 12px}
.pair .t{background:var(--thu-soft)} .pair .c{background:var(--chi-soft)}
.pair b{display:block;font-size:17px;overflow-wrap:anywhere}
.pair .t b{color:var(--thu)} .pair .c b{color:var(--chi)}

.add{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].chi{background:var(--chi);color:#fff}
.seg button[aria-pressed="true"].thu{background:var(--thu);color:#fff}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amt:focus-within{border-color:var(--accent)}
.amt input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:30px;font-weight:700;color:var(--ink);outline:none}
.amt span{font-size:20px;color:var(--muted);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 11px;font-size:14px}
.cats button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.row input{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.save{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
.save:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;color:var(--muted);min-height:1em}

section h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px 8px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar .fill{height:100%;background:var(--chi);border-radius:5px}
.bar .v{color:var(--muted);font-size:13px;text-align:right;min-width:72px}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:130px;padding-top:8px}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mcol .pair2{display:flex;gap:3px;align-items:flex-end;height:100px}
.mcol i{display:block;width:10px;border-radius:3px 3px 0 0;min-height:2px}
.mcol i.t{background:var(--thu)} .mcol i.c{background:var(--chi)}
.mcol span{font-size:11px;color:var(--muted)}
.mcol.cur span{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.day{margin-bottom:10px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px;font-weight:600}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.dot.chi{background:var(--chi-soft);color:var(--chi)} .dot.thu{background:var(--thu-soft);color:var(--thu)}
.item .name{min-width:0} .item .name b{display:block;font-weight:600;font-size:14px}
.item .name small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.item .a{font-weight:700;font-size:15px}
.item .a.chi{color:var(--chi)} .item .a.thu{color:var(--thu)}
.del{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:15px}
.del.confirm{width:auto;padding:0 10px;background:var(--chi);color:#fff;font-size:13px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.fill,.mcol i{transition:height .3s,width .3s}}
</style>

<div class="wrap">
  <header>
    <h1>Sổ Thu Chi</h1>
    <div class="month">
      <button id="prev" aria-label="Tháng trước">‹</button>
      <span id="mlabel" class="num">Tháng</span>
      <button id="next" aria-label="Tháng sau">›</button>
    </div>
  </header>

  <div class="sum">
    <div>
      <div class="label">Còn lại trong tháng</div>
      <div class="left num" id="left">0 ₫</div>
    </div>
    <div class="pair">
      <div class="t"><span class="label">Thu</span><b class="num" id="sumThu">0 ₫</b></div>
      <div class="c"><span class="label">Chi</span><b class="num" id="sumChi">0 ₫</b></div>
    </div>
  </div>

  <form class="add" id="form" autocomplete="off">
    <div class="seg" role="group" aria-label="Loại">
      <button type="button" class="chi" id="tChi" aria-pressed="true">Chi tiền</button>
      <button type="button" class="thu" id="tThu" aria-pressed="false">Thu tiền</button>
    </div>
    <label class="amt"><input id="amount" inputmode="numeric" placeholder="0" aria-label="Số tiền"><span>₫</span></label>
    <div class="quick" id="quick"></div>
    <div class="cats" id="cats"></div>
    <div class="row">
      <input id="note" placeholder="Ghi chú (không bắt buộc)" maxlength="80" aria-label="Ghi chú">
      <input id="date" type="date" aria-label="Ngày">
    </div>
    <button class="save" id="save" type="submit" disabled>Ghi vào sổ</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <section>
    <h2>Chi theo nhóm</h2>
    <div class="card"><div class="bars" id="bars"></div></div>
  </section>

  <section>
    <h2>6 tháng gần đây</h2>
    <div class="card">
      <div class="months" id="months"></div>
      <div class="legend"><span><i style="background:var(--thu)"></i>Thu</span><span><i style="background:var(--chi)"></i>Chi</span></div>
    </div>
  </section>

  <section>
    <h2>Các khoản trong tháng</h2>
    <div class="card" id="list"></div>
  </section>

  <p class="note" id="store">Đang mở sổ…</p>
</div>

<script>
const CATS = {
  chi: ["Ăn uống","Đi lại","Mua sắm","Hóa đơn","Nhà cửa","Sức khỏe","Giải trí","Khác"],
  thu: ["Lương","Bán hàng","Thưởng","Được cho","Khác"]
};
const QUICK = [10000,20000,50000,100000,200000,500000];
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("vi-VN") + " ₫";
const short = n => n >= 1e6 ? (n/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+"tr" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

let items = [];
let type = "chi", cat = CATS.chi[0];
let view = (() => { const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1}; })();
let pendingDel = null;

/* ---------- lưu trữ: sổ riêng trên claude.ai, hoặc trên máy này ---------- */
const LKEY = "so-thu-chi-v1";
const store = { mode:"local", col:null,
  loadLocal(){ try{ items = JSON.parse(localStorage.getItem(LKEY)||"[]"); }catch(e){ items=[]; } },
  saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(items)); return true; }catch(e){ return false; } },
  async add(it){
    if(this.mode==="db"){ const {id,...body}=it; await this.col.doc(id).set(body); return; }
    items.push(it); if(!this.saveLocal()) throw new Error("local"); render();
  },
  async remove(id){
    if(this.mode==="db"){ await this.col.doc(id).delete(); return; }
    items = items.filter(x=>x.id!==id); this.saveLocal(); render();
  }
};
function setStoreNote(t){ $("store").textContent = t; }

async function boot(){
  store.loadLocal(); render();
  if(!window.claude || !window.claude.use){ setStoreNote("Dữ liệu được lưu trên trình duyệt của máy này."); return; }
  try{
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setStoreNote("Dữ liệu được lưu trên trình duyệt của máy này. Đăng nhập claude.ai để dùng trên mọi thiết bị."); return; }
    store.mode="db"; store.col = db.collection("data/users/"+uid);
    items = []; render(); setStoreNote("Đang tải sổ của bạn…");
    const timer = setTimeout(()=>setStoreNote("Chưa kết nối được sổ. Kiểm tra mạng, dữ liệu sẽ hiện khi có kết nối."),10000);
    store.col.onSnapshot(snap=>{
      items = snap.docs.map(d=>({id:d.id, ...d.data()}));
      if(!snap.metadata.fromCache){ clearTimeout(timer); setStoreNote("Sổ riêng của bạn, chỉ bạn xem được, mở trên thiết bị nào cũng thấy."); }
      render();
    }, err=>{ clearTimeout(timer); setStoreNote("Không mở được sổ lúc này. Tải lại trang sau ít phút."); });
  }catch(e){ setStoreNote("Dữ liệu được lưu trên trình duyệt của máy này."); }
}

/* ---------- form ---------- */
function setType(t){
  type=t; cat=CATS[t][0];
  $("tChi").setAttribute("aria-pressed", t==="chi"); $("tThu").setAttribute("aria-pressed", t==="thu");
  $("save").textContent = t==="chi" ? "Ghi khoản chi" : "Ghi khoản thu";
  drawCats();
}
function drawCats(){
  $("cats").innerHTML="";
  CATS[type].forEach(c=>{ const b=document.createElement("button"); b.type="button"; b.textContent=c;
    b.setAttribute("aria-pressed", c===cat); b.onclick=()=>{cat=c; drawCats();}; $("cats").appendChild(b); });
}
function amountValue(){ return parseInt(($("amount").value||"").replace(/\D/g,""),10)||0; }
function setAmount(n){ $("amount").value = n ? n.toLocaleString("vi-VN") : ""; $("save").disabled = !n; }
$("amount").addEventListener("input",()=>{ setAmount(amountValue()); });
QUICK.forEach(q=>{ const b=document.createElement("button"); b.type="button"; b.textContent="+"+short(q);
  b.onclick=()=>setAmount(amountValue()+q); $("quick").appendChild(b); });
$("tChi").onclick=()=>setType("chi"); $("tThu").onclick=()=>setType("thu");
$("date").value = today();

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const amount = amountValue(); if(!amount) return;
  const it = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    type, cat, amount, note: $("note").value.trim(), date: $("date").value || today(), ts: Date.now() };
  $("save").disabled = true;
  try{
    await store.add(it);
    $("msg").textContent = (type==="chi"?"Đã ghi chi ":"Đã ghi thu ") + fmt(amount) + " · " + cat;
    setAmount(0); $("note").value="";
    const [y,m] = it.date.split("-").map(Number); view={y,m}; render();
  }catch(err){
    $("msg").textContent = "Chưa ghi được. Kiểm tra mạng rồi bấm lại.";
    $("save").disabled = false;
  }
});

$("prev").onclick=()=>{ view.m--; if(view.m<1){view.m=12;view.y--;} render(); };
$("next").onclick=()=>{ view.m++; if(view.m>12){view.m=1;view.y++;} render(); };

/* ---------- vẽ ---------- */
const inMonth = (it,y,m) => it.date && it.date.startsWith(`${y}-${pad(m)}`);
function totals(y,m){ let t=0,c=0; items.forEach(it=>{ if(inMonth(it,y,m)){ if(it.type==="thu") t+=it.amount; else c+=it.amount; }}); return {t,c}; }

function render(){
  const {y,m} = view;
  $("mlabel").textContent = `Tháng ${m}/${y}`;
  const {t,c} = totals(y,m);
  $("sumThu").textContent = fmt(t); $("sumChi").textContent = fmt(c);
  $("left").textContent = (t-c<0?"−":"") + fmt(Math.abs(t-c)); $("left").classList.toggle("neg", t-c<0);

  // chi theo nhóm
  const by = {}; items.forEach(it=>{ if(it.type==="chi" && inMonth(it,y,m)) by[it.cat]=(by[it.cat]||0)+it.amount; });
  const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]); const max = rows[0]?.[1]||1;
  $("bars").innerHTML = rows.length ? "" : `<div class="empty">Chưa có khoản chi nào trong tháng này.</div>`;
  rows.forEach(([k,v])=>{ const d=document.createElement("div"); d.className="bar";
    d.innerHTML=`<span></span><div class="track"><div class="fill"></div></div><span class="v num"></span>`;
    d.children[0].textContent=k; d.querySelector(".fill").style.width=(v/max*100)+"%";
    d.querySelector(".v").textContent = fmt(v) + " · " + Math.round(v/c*100) + "%"; $("bars").appendChild(d); });

  // 6 tháng
  const ms=[]; for(let i=5;i>=0;i--){ let mm=m-i, yy=y; while(mm<1){mm+=12;yy--;} ms.push({y:yy,m:mm,...totals(yy,mm)}); }
  const top = Math.max(1,...ms.map(x=>Math.max(x.t,x.c)));
  $("months").innerHTML="";
  ms.forEach((x,i)=>{ const d=document.createElement("div"); d.className="mcol"+(i===5?" cur":"");
    d.innerHTML=`<div class="pair2"><i class="t"></i><i class="c"></i></div><span>T${x.m}</span>`;
    d.querySelector(".t").style.height=(x.t/top*100)+"px"; d.querySelector(".c").style.height=(x.c/top*100)+"px";
    d.title=`Tháng ${x.m}: thu ${fmt(x.t)}, chi ${fmt(x.c)}`; $("months").appendChild(d); });

  // danh sách
  const list = items.filter(it=>inMonth(it,y,m)).sort((a,b)=> b.date.localeCompare(a.date) || b.ts-a.ts);
  const L = $("list"); L.innerHTML="";
  if(!list.length){ L.innerHTML = `<div class="empty"><b>Sổ tháng này còn trống</b>Nhập số tiền ở trên, chọn nhóm rồi bấm “Ghi khoản chi”.</div>`; return; }
  const days = {}; list.forEach(it=>(days[it.date]=days[it.date]||[]).push(it));
  Object.keys(days).forEach(dk=>{
    const [yy,mm,dd]=dk.split("-").map(Number); const wd=["CN","T2","T3","T4","T5","T6","T7"][new Date(yy,mm-1,dd).getDay()];
    const net = days[dk].reduce((s,it)=>s+(it.type==="thu"?it.amount:-it.amount),0);
    const box=document.createElement("div"); box.className="day";
    box.innerHTML=`<div class="dh"><span>${wd}, ${dd}/${mm}</span><span class="num">${net>=0?"+":"−"}${fmt(Math.abs(net))}</span></div>`;
    const inner=document.createElement("div");
    days[dk].forEach(it=>{
      const r=document.createElement("div"); r.className="item";
      r.innerHTML=`<div class="dot ${it.type}"></div><div class="name"><b></b><small></small></div><div class="a num ${it.type}"></div><button class="del" aria-label="Xóa khoản này">✕</button>`;
      r.querySelector(".dot").textContent = it.cat.slice(0,2);
      r.querySelector("b").textContent = it.cat; r.querySelector("small").textContent = it.note||"";
      r.querySelector(".a").textContent = (it.type==="thu"?"+":"−")+fmt(it.amount);
      const del=r.querySelector(".del");
      if(pendingDel===it.id){ del.classList.add("confirm"); del.textContent="Xóa?"; }
      del.onclick=async()=>{ if(pendingDel!==it.id){ pendingDel=it.id; render(); return; }
        pendingDel=null; try{ await store.remove(it.id); }catch(e){ $("msg").textContent="Chưa xóa được. Thử lại sau."; } };
      inner.appendChild(r);
    });
    box.appendChild(inner); L.appendChild(box);
  });
}

setType("chi");
boot();
</script>
